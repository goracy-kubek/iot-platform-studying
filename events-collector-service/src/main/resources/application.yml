spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:red_pass}

  kafka:
    properties.schema.registry.url: http://localhost:8081
    producer:
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      group-id: device-events-group
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties.specific.avro.reader: true
    listener:
      ack-mode: manual

  datasource:
    url: jdbc:clickhouse://localhost:8123/${CLICKHOUSE_DATABASE:default}
    username: ${CLICKHOUSE_USER:demo_user}
    password: ${CLICKHOUSE_PASSWORD:demo_pass}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver

dedup.ttl: 1m

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
      base-path: /actuator